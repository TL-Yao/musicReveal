[package]
name = "musicreveal-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "musicReveal 桌面应用：监听、队列与 Tauri 外壳"

[lib]
name = "musicreveal_app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reveal-core = { path = "../../crates/reveal-core" }
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
async-trait = "0.1.92"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "time", "sync"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "flac", "mp3", "mp4", "symphonia-alac", "vorbis", "wav"] }
souvlaki = { version = "0.9", default-features = false }

[features]
# 只给测试：`home()` 换成本进程自己的临时目录。由下面对自身的 dev 依赖打开，
# 所以每个测试（含以后新写的）默认都碰不到真实的 ~/Music；应用构建不带它。
test-home = []

[dev-dependencies]
musicreveal-app = { path = ".", features = ["test-home"] }
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
