<!doctype html>
<html lang="zh-CN">
  <head>

  <symbol id="i-check" viewBox="0 0 20 20"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M4 10.5l4 4 8-9"/></symbol>
  <symbol id="i-lock" viewBox="0 0 20 20"><path fill="currentColor" d="M6 8V6.5a4 4 0 0 1 8 0V8h.5A1.5 1.5 0 0 1 16 9.5v6A1.5 1.5 0 0 1 14.5 17h-9A1.5 1.5 0 0 1 4 15.5v-6A1.5 1.5 0 0 1 5.5 8H6Zm1.6 0h4.8V6.5a2.4 2.4 0 0 0-4.8 0V8Z"/></symbol>

</svg>

<div class="app" id="win">
  <aside class="sidebar">
    <div class="lights" data-tauri-drag-region></div>

    <section class="group" data-group="folders">
      <header><h3>监听文件夹</h3><button class="icon-btn" id="addFolder" title="添加文件夹…"><svg><use href="#i-plus"/></svg></button></header>
      <div id="folderList"></div>
    </section>

    <section class="group" data-group="qq">
      <header><h3>QQ 音乐</h3></header>
      <div class="qq" id="qqRow"></div>
    </section>

    <section class="group" data-group="output">
      <header><h3>输出</h3></header>
      <div class="srow" id="outDir" role="button" title="选择输出文件夹…">
        <span class="ico"><svg><use href="#i-folder"/></svg></span>
        <span><div class="name" id="outName"></div><div class="path" id="outPath"></div></span>
        <span></span>
      </div>
      <div class="seg" id="fmtSeg" data-on="0"><div class="thumb"></div><button data-v="original">原格式</button><button data-v="mp3">MP3</button></div>
    </section>
  </aside>

  <main class="content">
    <header class="toolbar" data-tauri-drag-region>
      <div class="titles" data-tauri-drag-region><h1 data-tauri-drag-region>musicReveal</h1><p id="subtitle" data-tauri-drag-region></p></div>
      <button class="glass-btn" id="addFiles"><svg><use href="#i-plus"/></svg>添加文件…</button>
    </header>
    <div class="body">
      <div class="scroll" id="scroll">
        <div id="notices"></div>
        <ul class="tasks" id="tasks"></ul>
      </div>
      <div class="stage off" id="stage"></div>
      <div class="drop" id="drop">
        <div class="pane"></div>
        <div class="inner">
          <div class="tile"><div class="art"></div><div class="dash"></div></div>
          <h3 id="dropTitle"></h3>
          <p>将与监听文件夹中的歌曲一样处理。</p>
          <div class="files" id="dropFiles"></div>
        </div>
      </div>
    </div>
  </main>
</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
