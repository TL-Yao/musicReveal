<div class="app" id="win">
  <aside class="sidebar">
    <div class="lights" data-tauri-drag-region></div>
    <div class="search" id="searchBox" data-group="lib"><svg><use href="#i-search"/></svg><input id="searchInput" placeholder="搜索" aria-label="搜索资料库" spellcheck="false" autocomplete="off"><button class="clear" id="searchClear" title="清除"><svg><use href="#i-x"/></svg></button></div>
    <section class="group" data-group="lib">
      <header><h3>资料库</h3></header>
      <div class="nav on"><span class="ico"><svg><use href="#i-note"/></svg></span><span class="name">歌曲</span><span class="count" id="navCount"></span></div>

      <div id="folderList"></div>
    </section>
    <div class="sb-foot">
      <div id="qqAlert"></div>
      <div class="sb-status" id="sbStatus"></div>
    </div>
  </aside>

  <main class="content">
    <header class="toolbar" data-tauri-drag-region>
      <div class="tgroup">
        <button class="tbtn" id="btnShuffle" title="随机播放"><svg><use href="#i-shuffle"/></svg></button>
        <button class="tbtn" id="btnPrev" title="上一首"><svg><use href="#i-prev"/></svg></button>
        <button class="tbtn big" id="btnPlay" title="播放"><svg><use href="#i-play"/></svg></button>
        <button class="tbtn" id="btnNext" title="下一首"><svg><use href="#i-next"/></svg></button>
        <button class="tbtn" id="btnRepeat" title="循环播放"><svg><use href="#i-repeat"/></svg></button>
      </div>
      <div class="lcd idle" id="lcd">
        <div class="cover" id="lcdCover"></div>
        <div class="tx"><div class="t1" id="lcdT1">未在播放</div><div class="t2" id="lcdT2"></div></div><div></div>
        <div class="scrub"><i></i><input type="range" min="0" max="1000" value="0" id="scrub" aria-label="播放进度"></div>
        <span class="time l" id="timeL">0:00</span><span class="time r" id="timeR">0:00</span>
      </div>
      <div class="tgroup">
        <button class="tbtn" id="btnLyrics" title="歌词"><svg><use href="#i-lyrics"/></svg></button>
        <div class="vol"><svg><use href="#i-speaker"/></svg><input type="range" class="slider" id="volRange" min="0" max="100" value="70" aria-label="音量"></div>
      </div>
    </header>
    <div class="body" id="bodyPanel">
      <div class="page-head">
        <div><h2>歌曲</h2><p id="libSub"></p></div>
        <div class="acts"><button class="btn" id="sortBtn"></button><button class="glass-btn" id="addFiles"><svg><use href="#i-plus"/></svg>添加文件…</button></div>
      </div>
      <div class="scroll" id="scroll">
        <div class="notices" id="notices"></div>
        <section class="tray off" id="tray"><div><div class="tray-in"><header id="trayHead"></header><div class="tasks-wrap" id="tasksWrap"><ul class="tasks" id="tasks"></ul></div></div></div></section>
        <div class="thead" id="thead"></div>
        <ul class="songs" id="songs" role="listbox" aria-label="歌曲" tabindex="0"></ul>
        <div class="void" id="void"></div>
      </div>
      <div class="stage off" id="stage"></div>
      <div class="lyrics" id="lyrics"></div>
      <div class="drop" id="drop">
        <div class="pane"></div>
        <div class="inner">
          <div class="tile"><div class="art"></div><div class="dash"></div></div>
          <h3 id="dropTitle"></h3>
          <p>与监听文件夹里的歌曲一样处理，转换完成后加入资料库。</p>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="settings-view" id="settings" hidden></div>
